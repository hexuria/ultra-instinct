[package]
name = "ultra-instinct-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "stdio JSON-RPC MCP server for the ultra-instinct action firewall"

[dependencies]
ultra-instinct-protocol = { path = "../ultra-instinct-protocol", version = "0.1.0"}
ultra-instinct-core = { path = "../ultra-instinct-core", version = "0.1.0"}
ultra-instinct-geometry = { path = "../ultra-instinct-geometry", version = "0.1.0"}
ultra-instinct-browser = { path = "../ultra-instinct-browser", version = "0.1.0"}
ultra-instinct-guard = { path = "../ultra-instinct-guard", version = "0.1.0"}
ultra-instinct-observe = { path = "../ultra-instinct-observe", version = "0.1.0"}
ultra-instinct-cdp = { path = "../ultra-instinct-cdp", version = "0.1.0"}
ultra-instinct-browser-tools = { path = "../ultra-instinct-browser-tools", version = "0.1.0"}
serde_json = "1"

[dev-dependencies]
proptest = "1.7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

