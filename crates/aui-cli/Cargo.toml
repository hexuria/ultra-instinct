[package]
name = "aui-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "ultra-instinct command line"

[dependencies]
aui-core = { path = "../aui-core" }
aui-resonance = { path = "../aui-resonance" }
aui-browser = { path = "../aui-browser" }
aui-guard = { path = "../aui-guard" }
aui-observe = { path = "../aui-observe" }
aui-mcp = { path = "../aui-mcp" }
aui-protocol = { path = "../aui-protocol" }
aui-agent = { path = "../aui-agent" }
aui-policy = { path = "../aui-policy" }
aui-dojo = { path = "../aui-dojo" }
aui-remote = { path = "../aui-remote", optional = true }

[dev-dependencies]
serde_json = "1"

[lib]
name = "aui_cli"
path = "src/lib.rs"

[[example]]
# Manual, opt-in live drive with JEV. Historical; product path is observe/guard/verify.
name = "live_drive"
required-features = ["jev"]

[[bin]]
name = "ultra-instinct"
path = "src/main.rs"

[[bin]]
# Short alias for the same CLI (AUI = Autonomous Ultra Instinct).
name = "aui"
path = "src/bin/aui.rs"

[features]
default = []
# Optional System One client. Not part of `cargo build` or `cargo test`.
jev = ["dep:aui-remote", "aui-remote/jev", "dep:serde_json", "aui-policy/remote"]
# Optional Cloudflare Workers AI Clef / Clef-Flash client (same closed remote wire).
clef = ["jev", "aui-remote/clef"]
# Experimental HGRA matcher (wires into aui-mcp / mcp locate+guard).
hgra = ["aui-mcp/hgra"]
# Model-backed TYPE_TEXT / SELECT payloads via `run --text-model-cmd <program>`;
# without the flag, jev-ultrafast's TEXT_MODEL_* env drives an HTTP model (OpenAI-compatible,
# Anthropic, or Gemini wire; TEXT_MODEL_API or the base URL host picks it).
model-text = ["aui-agent/model-text", "aui-policy/model-text", "dep:aui-remote", "aui-remote/model-text", "dep:serde_json"]

[dependencies.serde_json]
version = "1"
optional = true
