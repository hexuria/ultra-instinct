[package]
name = "aui-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "ultra-instinct remote decision transports (JEV / Clef) and the HTTP text model"

# The only crate that carries model SDKs and an HTTP client. Every leg is an
# optional feature; aui-cli turns them on.
[dependencies]
aui-policy = { path = "../aui-policy" }

[dev-dependencies]
aui-core = { path = "../aui-core" }

[features]
default = []
# System One (JEV) transport for RemotePolicy.
jev = ["dep:typesafe-sdk", "dep:serde_json", "aui-policy/remote"]
# Cloudflare Workers AI Clef / Clef-Flash over the same closed wire.
clef = ["jev", "typesafe-sdk/clef"]
# HTTP text model (OpenAI-compatible, Anthropic, or Gemini wire) for TYPE_TEXT / SELECT payloads.
model-text = ["aui-policy/model-text", "dep:reqwest", "dep:serde_json"]

[dependencies.typesafe-sdk]
version = "0.3.0"
optional = true
default-features = false
features = ["blocking"]

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.reqwest]
version = "0.12"
optional = true
default-features = false
features = ["blocking", "json", "rustls-tls", "http2", "system-proxy", "charset"]
