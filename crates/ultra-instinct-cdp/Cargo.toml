[package]
name = "ultra-instinct-cdp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "CDP wire for ultra-instinct: transport trait, blocking websocket, replay transport, replay script builder."

[dependencies]
serde_json = { version = "1", features = ["raw_value"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

# Pipe transport (`--remote-debugging-pipe`): safe poll(2) on both ends for call deadlines, and
# fcntl(2) to make the write end non-blocking.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["event", "fs", "std"] }

[dev-dependencies]
proptest = "1.11"
