[package]
name = "ultra-instinct-verbs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "ultra-instinct shell verbs and the session daemon"

[dependencies]
ultra-instinct-browser = { path = "../ultra-instinct-browser", version = "0.1.1"}
ultra-instinct-guard = { path = "../ultra-instinct-guard", version = "0.1.1"}
ultra-instinct-mcp = { path = "../ultra-instinct-mcp", version = "0.1.1"}

[dependencies.serde_json]
version = "1"

[target.'cfg(windows)'.dependencies]
# Local-socket IPC for the session daemon: Windows named pipes.
# Pinned: 2.4.9 is under a week old. widestring builds the pipe's
# security descriptor from SDDL.
interprocess = "=2.4.9"
widestring = "=1.2.1"
