[package]
name = "ultra-instinct"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "ultra-instinct command line"

[dependencies]
ultra-instinct-core = { path = "../ultra-instinct-core", version = "0.1.0"}
ultra-instinct-resonance = { path = "../ultra-instinct-resonance", version = "0.1.0"}
ultra-instinct-browser = { path = "../ultra-instinct-browser", version = "0.1.0"}
ultra-instinct-guard = { path = "../ultra-instinct-guard", version = "0.1.0"}
ultra-instinct-observe = { path = "../ultra-instinct-observe", version = "0.1.0"}
ultra-instinct-mcp = { path = "../ultra-instinct-mcp", version = "0.1.0"}
ultra-instinct-protocol = { path = "../ultra-instinct-protocol", version = "0.1.0"}
ultra-instinct-agent = { path = "../ultra-instinct-agent", version = "0.1.0"}
ultra-instinct-policy = { path = "../ultra-instinct-policy", version = "0.1.0"}
ultra-instinct-dojo = { path = "../ultra-instinct-dojo", version = "0.1.0"}
ultra-instinct-remote = { path = "../ultra-instinct-remote", optional = true, version = "0.1.0"}

[dev-dependencies]
serde_json = "1"

[lib]
name = "ultra_instinct"
path = "src/lib.rs"

[[example]]
# Manual, opt-in live drive with JEV. Historical; product path is observe/guard/verify.
name = "live_drive"
required-features = ["jev"]

[[bin]]
name = "ultra-instinct"
path = "src/main.rs"

[[bin]]
# Short alias for the same CLI (AUI = Autonomous Ultra Instinct).
name = "aui"
path = "src/bin/aui.rs"

[features]
default = []
# Optional System One client. Not part of `cargo build` or `cargo test`.
jev = ["dep:ultra-instinct-remote", "ultra-instinct-remote/jev", "dep:serde_json", "ultra-instinct-policy/remote"]
# Optional Cloudflare Workers AI Clef / Clef-Flash client (same closed remote wire).
clef = ["jev", "ultra-instinct-remote/clef"]
# Experimental HGRA matcher (wires into ultra-instinct-mcp / mcp locate+guard).
hgra = ["ultra-instinct-mcp/hgra"]
# Model-backed TYPE_TEXT / SELECT payloads via `run --text-model-cmd <program>`;
# without the flag, jev-ultrafast's TEXT_MODEL_* env drives an HTTP model (OpenAI-compatible,
# Anthropic, or Gemini wire; TEXT_MODEL_API or the base URL host picks it).
model-text = ["ultra-instinct-agent/model-text", "ultra-instinct-policy/model-text", "dep:ultra-instinct-remote", "ultra-instinct-remote/model-text", "dep:serde_json"]

[dependencies.serde_json]
version = "1"
optional = true
