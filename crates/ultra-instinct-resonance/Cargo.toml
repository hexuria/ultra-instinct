[package]
name = "ultra-instinct-resonance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Deterministic locate ranking for a static ultra-instinct manifold"

[dependencies]
ultra-instinct-core = { path = "../ultra-instinct-core", version = "0.1.0"}
ultra-instinct-geometry = { path = "../ultra-instinct-geometry", version = "0.1.0"}
ultra-instinct-hyper = { path = "../../experiments/hgra/ultra-instinct-hyper", optional = true, version = "0.1.0"}
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }

[features]
default = []
# Experimental HGRA matcher. Not the product default.
hgra = ["dep:ultra-instinct-hyper"]

[dev-dependencies]
proptest = "1.7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
