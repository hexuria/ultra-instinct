[package]
name = "aui-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "stdio JSON-RPC MCP server for the ultra-instinct action firewall"

[dependencies]
aui-protocol = { path = "../aui-protocol" }
aui-core = { path = "../aui-core" }
aui-resonance = { path = "../aui-resonance" }
aui-browser = { path = "../aui-browser" }
aui-guard = { path = "../aui-guard" }
aui-observe = { path = "../aui-observe" }
aui-agent = { path = "../aui-agent" }
aui-cdp = { path = "../aui-cdp" }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
proptest = "1.7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[features]
# Experimental HGRA matcher for live remasure (world_context_live).
hgra = ["aui-resonance/hgra"]
