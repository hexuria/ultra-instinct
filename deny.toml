# RUSTSEC advisories are gated for every dependency; no advisory is ignored.
# Licenses are gated now that the workspace publishes to crates.io: every dep
# must be permissive (MIT / Apache-2.0 family). Bans and sources stay unchecked.
# See docs/DECISIONS.md.
[graph]
all-features = true

[advisories]
# Unmaintained and yanked are reported for every dependency. No advisory is
# ignored. Add an ignore only with a reason and a DECISIONS entry.
ignore = []

[licenses]
# Audited 2026-10: 182 deps, all permissive. OR-expressions pass on one arm
# (e.g. r-efi's `MIT OR Apache-2.0 OR LGPL-2.1-or-later` passes via MIT).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
