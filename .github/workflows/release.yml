# Release binaries (plan P1.1). A `v*` tag builds `aui` + `ultra-instinct` for
# every target below and attaches one archive per target, a `.sha256` beside
# each, and a combined SHA256SUMS to a GitHub release. A tag with a `-`
# (v0.2.0-rc.1) is marked as a prerelease. A pull request that touches this
# file runs the build matrix only, so the workflow is tested before it merges.
#
# Archive names carry no version, so the newest one is always at
#   https://github.com/hexuria/ultra-instinct/releases/latest/download/aui-<target>.tar.gz
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The full policy surface, same as scripts/install-aui.sh.
  FEATURES: jev clef model-text

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and target
        run: rustup toolchain install && rustup target add "$TARGET"
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: The tag matches the workspace version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.packages[] | select(.name == "ultra-instinct") | .version')"
          case "${TAG#v}" in
            "$version" | "$version"-*) ;;
            *) echo "tag $TAG does not match crate version $version" >&2; exit 1 ;;
          esac
      - name: Build
        run: cargo build --release --locked -p ultra-instinct --features "$FEATURES" --target "$TARGET"
      - name: Each binary runs and prints its version
        run: |
          set -euo pipefail
          for bin in aui ultra-instinct; do
            "target/$TARGET/release/$bin" --version
          done
      - name: Package
        run: |
          set -euo pipefail
          stage="aui-$TARGET"
          mkdir -p "dist/$stage"
          cp "target/$TARGET/release/aui" "target/$TARGET/release/ultra-instinct" LICENSE README.md "dist/$stage/"
          cd dist
          tar -czf "$stage.tar.gz" "$stage"
          rm -r "$stage"
          if command -v sha256sum >/dev/null; then
            sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"
          else
            shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          test "$(ls ./*.tar.gz | wc -l)" -eq 6
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          flags=(--verify-tag --title "$TAG" --generate-notes)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "${flags[@]}" ./*.tar.gz ./*.sha256 SHA256SUMS
