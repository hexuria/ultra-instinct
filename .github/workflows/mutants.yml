name: mutants
# Mutation testing for the Agent + Instinct + ticket safety boundary
# (impeccable audit R6, baseline 87ffc2d). Not on PRs: it rebuilds per mutant.
# Run locally: see docs/IMPECCABLE-AUDIT.md#mutation-testing.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Manila
  workflow_dispatch:

permissions:
  contents: read

# Scheduled: never cancel an in-flight mutants run; a newer commit just queues.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gate-ticket-executor
            args: >-
              -f crates/aui-guard/src/gate.rs
              -f crates/aui-guard/src/ticket.rs
              -f crates/aui-agent/src/executor.rs
          - name: world-of-target
            args: >-
              -f crates/aui-guard/src/world.rs
              --re 'of_target|neighborhood_of|nearby'
    name: mutants (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-mutants
      # Exit code 2 = missed mutants (a test gap), 3 = timeouts. Either fails the job.
      - run: cargo mutants --no-shuffle --timeout 300 -j 2 -o mutants-out $MUTANTS_ARGS
        env:
          MUTANTS_ARGS: ${{ matrix.args }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.name }}
          path: mutants-out/mutants.out
