# cargo-mutants config. Nightly job: .github/workflows/mutants.yml.
# How to run locally: AGENTS.md, "Verification owners" (mutation testing).

# Equivalent for testing purposes:
# `mix` ends each segment with `*hash ^= 0xff`. Mutating that to `|= 0xff`
# keeps a working (weaker) separator; telling them apart needs a 64-bit
# collision, which no deterministic test can construct cheaply. `^= byte` →
# `|= byte` and `^= 0xff` → `&= 0xff` ARE caught by
# `world_fingerprint_has_no_collisions_across_distinct_worlds`.
# Column 11 is the separator statement (`*hash ^= 0xff;`), column 15 the
# per-byte xor, which must stay in the run.
exclude_re = ['ticket\.rs:\d+:11: replace \^= with \|= in mix$']
