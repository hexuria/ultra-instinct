[workspace]
resolver = "2"
members = [
    "crates/ultra-instinct-core",
    "crates/ultra-instinct-geometry",
    "crates/ultra-instinct-observe",
    "crates/ultra-instinct-cdp",
    "crates/ultra-instinct-chrome",
    "crates/ultra-instinct-browser",
    "crates/ultra-instinct-protocol",
    "crates/ultra-instinct-guard",
    "crates/ultra-instinct-policy",
    "crates/ultra-instinct-agent",
    "crates/ultra-instinct-browser-tools",
    "crates/ultra-instinct-mcp",
    "crates/ultra-instinct-remote",
    "crates/ultra-instinct",
    "crates/ultra-instinct-dojo",
]
# Deleted from the product graph (see docs/DECISIONS.md product pivot):
# ultra-instinct-browser-use, ultra-instinct-cua, ultra-instinct-macos, ultra-instinct-executor;
# ultra-instinct-resonance and the HGRA experiment ultra-instinct-hyper (ADR 0012)

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = true
rust-version = "1.99"
repository = "https://github.com/hexuria/ultra-instinct"


[workspace.dependencies]
# Instinct 0.1.0 from crates.io (hexuria/instinct#35). Was pinned to git rev
# a42d16b (ADR 0008); 0.1.0 = that rev + nfc span-mapping fixes. Bump only
# with deliberate eval.
instinct-core = "0.1.0"
instinct-text = "0.1.0"
instinct-lexicon = "0.1.0"
