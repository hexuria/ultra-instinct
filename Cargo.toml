[workspace]
resolver = "2"
members = [
    "crates/aui-core",
    "crates/aui-geometry",
    "crates/aui-observe",
    "crates/aui-resonance",
    "crates/aui-cdp",
    "crates/aui-browser",
    "crates/aui-protocol",
    "crates/aui-guard",
    "crates/aui-policy",
    "crates/aui-agent",
    "crates/aui-mcp",
    "crates/aui-remote",
    "crates/aui-cli",
    "crates/aui-dojo",
    # Experimental. Not on the product path. Build with -p aui-hyper --features unused
    # or via aui-resonance's `hgra` feature.
    "experiments/hgra/aui-hyper",
]
# Deleted from the product graph (see docs/DECISIONS.md product pivot):
# aui-browser-use, aui-cua, aui-macos, aui-executor

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.99"


[workspace.dependencies]
# Instinct 0.1.0 from crates.io (hexuria/instinct#35). Was pinned to git rev
# a42d16b (ADR 0008); 0.1.0 = that rev + nfc span-mapping fixes. Bump only
# with deliberate eval.
instinct-core = "0.1.0"
instinct-text = "0.1.0"
instinct-lexicon = "0.1.0"
